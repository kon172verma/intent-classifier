name: release-experiments-registry

on:
    push:
        tags:
            - "v*"
    release:
        types: [published]
    workflow_dispatch:

jobs:
    verify-registry:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install dependencies
              run: python -m pip install --upgrade pip huggingface_hub

            - name: Verify EXPERIMENTS registry drift
              env:
                  HF_TOKEN: ${{ secrets.HF_TOKEN }}
              run: python scripts/sync_experiments_registry.py --strict
